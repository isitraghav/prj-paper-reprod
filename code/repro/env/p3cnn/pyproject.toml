# P3 (Deitsch et al. 2019) CNN env. Paper: Keras 2.0 + TensorFlow 1.4 (CUDA 8) on 2x GTX 1080 -- cannot run on
# Ampere GPUs. Closest runnable: TensorFlow 2.10.1 (last native-Windows GPU release, tf.keras, same Keras ImageNet
# VGG-19 weights). CUDA 11.x runtime + cuDNN 8.9 come from NVIDIA pip wheels (DLLs put on PATH by p3/cuda_path.py).
# Sync:  UV_PROJECT_ENVIRONMENT="$PWD/envs/p3cnn" uv sync --project code/repro/env/p3cnn --frozen
[project]
name = "repro-p3-cnn"
version = "0"
requires-python = "==3.10.*"
dependencies = [
  "tensorflow==2.10.1",
  "numpy==1.23.5",
  "protobuf==3.19.6",
  "pillow==9.5.0",
  "pandas==2.0.3",
  "scikit-learn==1.3.2",
  "matplotlib==3.7.5",
  "nvidia-cuda-runtime-cu11==11.8.89",
  "nvidia-cublas-cu11==11.11.3.6",
  "nvidia-cufft-cu11==10.9.0.58",
  "nvidia-curand-cu11==10.3.0.86",
  "nvidia-cusolver-cu11==11.4.1.48",
  "nvidia-cusparse-cu11==11.7.5.86",
  "nvidia-cudnn-cu11==8.9.5.29",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
