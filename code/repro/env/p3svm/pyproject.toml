# P3 (Deitsch et al. 2019) SVM env. Paper: OpenCV 3.3.1 (KAZE detector, xfeatures2d VGG descriptor), LIBLINEAR,
# mini-batch k-means (Sculley 2010), PCA whitening -- i.e. the scikit-learn stack of 2017/18. OpenCV 3.3.1 has no
# wheels for any Python uv can install here -> closest: opencv-contrib-python 3.4.18 (same KAZE/VGG implementations).
# Sync:  UV_PROJECT_ENVIRONMENT="$PWD/envs/p3svm" uv sync --project code/repro/env/p3svm --frozen
[project]
name = "repro-p3-svm"
version = "0"
requires-python = "==3.8.*"
dependencies = [
  "opencv-contrib-python==3.4.18.65",
  "numpy==1.18.5",
  "scipy==1.4.1",
  "scikit-learn==0.22.2.post1",
  "joblib==0.14.1",
  "pandas==1.0.5",
  "pillow==9.5.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
