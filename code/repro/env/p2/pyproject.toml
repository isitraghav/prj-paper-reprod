# P2 (Mazen et al.) training env. Paper: Python 3.8.8, PyTorch 1.11.0, CUDA 11.1 (Kaggle P100).
# torch 1.11.0 has no cu111 wheel (only cu113/cu115), so cu113 is used (init.md §11 item 3).
# ultralytics 8.0.99 = last release before P2 was received. Other packages pinned to first resolution (2026-10-17).
# roboflow is deliberately absent (pins opencv-python-headless); the dataset download uses a throwaway env.
# Sync:  UV_PROJECT_ENVIRONMENT=envs/p2 uv sync --project code/repro/env/p2 --frozen
[project]
name = "repro-p2-eldds"
version = "0"
requires-python = "==3.8.8"
dependencies = [
  "torch==1.11.0+cu113",
  "torchvision==0.12.0+cu113",
  "ultralytics==8.0.99",
  "numpy==1.23.5",
  "opencv-python==4.8.1.78",
  "matplotlib==3.7.5",
  "pillow==9.5.0",
  "pyyaml==6.0.3",
  "scipy==1.10.1",
  "requests==2.32.4",
  "tqdm==4.70.1",
  "tensorboard==2.11.2",
  "seaborn==0.13.2",
  "pandas==2.0.3",
  "thop==0.1.1.post2209072238",
  "gitpython==3.2.1",
  "psutil==7.2.2",
  "ipython==8.12.3",
  "protobuf==3.20.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu113" }
torchvision = { index = "pytorch-cu113" }
