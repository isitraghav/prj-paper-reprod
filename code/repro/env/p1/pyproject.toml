# P1 (GBH-YOLOv5) training env. Paper: PyTorch 1.8, CUDA 11.1; GBH README: torch 1.8.1, python 3.8, CUDA 11.1.
# Packages the paper doesn't name are pinned to the versions this env was first resolved with (2026-10-17).
# Sync:  UV_PROJECT_ENVIRONMENT=envs/p1 uv sync --project code/repro/env/p1 --frozen
[project]
name = "repro-p1-gbh"
version = "0"
requires-python = "==3.8.*"
dependencies = [
  "torch==1.8.1+cu111",
  "torchvision==0.9.1+cu111",
  "numpy==1.23.5",
  "opencv-python==4.8.1.78",
  "matplotlib==3.7.5",
  "pillow==9.5.0",
  "pyyaml==6.0.3",
  "scipy==1.10.1",
  "tqdm==4.70.1",
  "tensorboard==2.11.2",
  "seaborn==0.13.2",
  "pandas==2.0.3",
  "thop==0.1.1.post2209072238",
  "pycocotools==2.0.7",
  "protobuf==3.20.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu111"
url = "https://download.pytorch.org/whl/cu111"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu111" }
torchvision = { index = "pytorch-cu111" }
