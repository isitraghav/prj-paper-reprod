# P1 ablation "YOLOv5-2" (paper Table 4-6: YOLOv5s + BottleneckCSP + extra tiny-target prediction head):
# GBH-YOLOv5 yaml with regular Conv in the backbone instead of GhostConv.
# paper Table 6: 290 layers / 7.72 M  (GhostConv swap is the only difference from GBH)
# 4-head Detect outputs: P2/4 (tiny), P3/8 (small), P4/16 (medium), P5/32 (large)
nc: 5  # number of classes (PV-Multi-Defect)
depth_multiple: 0.33
width_multiple: 0.50

anchors:
  - [5,6, 8,14, 15,11]       # P2/4  tiny target
  - [10,13, 16,30, 33,23]    # P3/8
  - [30,61, 62,45, 59,119]   # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 backbone — identical to yolov5_1.yaml; Conv replaces GhostConv vs GBH
backbone:
  [[-1, 1, Focus, [64, 3]],             # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],          # 1-P2/4
   [-1, 3, BottleneckCSP, [128]],       # 2
   [-1, 1, Conv, [256, 3, 2]],          # 3-P3/8
   [-1, 9, BottleneckCSP, [256]],       # 4
   [-1, 1, Conv, [512, 3, 2]],          # 5-P4/16
   [-1, 9, BottleneckCSP, [512]],       # 6
   [-1, 1, Conv, [1024, 3, 2]],         # 7-P5/32
   [-1, 1, SPP, [1024, [5, 9, 13]]],   # 8
   [-1, 3, BottleneckCSP, [1024, False]],  # 9
  ]

# 4-head neck+prediction — same as GBH-YOLOv5 (gbh_released.yaml)
head:
  [[-1, 1, Conv, [512, 1, 1]],            # 10
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 11
   [[-1, 6], 1, Concat, [1]],             # cat backbone P4  12
   [-1, 3, C3, [512, False]],             # 13

   [-1, 1, Conv, [512, 1, 1]],            # 14
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 15
   [[-1, 4], 1, Concat, [1]],             # cat backbone P3  16
   [-1, 3, C3, [512, False]],             # 17

   [-1, 1, Conv, [256, 1, 1]],            # 18
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 19
   [[-1, 2], 1, Concat, [1]],             # cat backbone P2  20
   [-1, 3, C3, [256, False]],             # 21  (P2/4-tiny)

   [-1, 1, Conv, [256, 3, 2]],            # 22
   [[-1, 18], 1, Concat, [1]],            # 23
   [-1, 3, C3, [256, False]],             # 24  (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],            # 25
   [[-1, 14], 1, Concat, [1]],            # cat head P4  26
   [-1, 3, C3, [512, False]],             # 27  (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],            # 28
   [[-1, 10], 1, Concat, [1]],            # cat head P5  29
   [-1, 3, C3, [1024, False]],            # 30  (P5/32-large)

   [[21, 24, 27, 30], 1, Detect, [nc, anchors]],  # Detect(P2,P3,P4,P5)
  ]
